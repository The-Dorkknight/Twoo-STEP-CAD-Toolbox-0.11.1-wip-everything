#
# On every push and pull request: run the tests and the golden benchmark on Linux, macOS and Windows,
# and keep the exact package versions that were used (LTS_POLICY.md gates 1, 2 and 5).
# WRITTEN BUT NOT YET RUN ON GITHUB: expect to fix something the first time it goes red.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      TOSTEP_NOPAUSE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the toolbox's packages and the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest playwright
      - name: Install a browser for the page test (Linux only; the test skips without one)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Contract tests (seconds)
        run: python -m pytest tests/test_contract.py tests/test_cad_adapters.py -q
      - name: Whole test suite
        run: python -m pytest tests -q
      - name: Golden benchmark (the release gate)
        run: python tools/golden.py
      - name: Record exactly which versions passed
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          { echo "os: ${{ matrix.os }}"; python --version; python run_tostep.py --version | head -1; python -m pip freeze; } > "dist/versions-${{ matrix.os }}.txt"
          cat "dist/versions-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: versions-${{ matrix.os }}
          path: dist/versions-${{ matrix.os }}.txt
