# Packaging for people who prefer `pip install .`; the portable start files do not use this.
# (Dependencies are the same ranges as requirements.txt; see LTS_POLICY.md gate 5 about pinning.)
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twoo-step-cad-toolbox"
dynamic = ["version"]
description = "Turn meshes, OpenSCAD models, hardpoint STLs and pictures into real STEP solids. Source-available, non-commercial."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE.md" }
authors = [{ name = "Matthew Armstrong", email = "The-Dorkknight@users.noreply.github.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "cadquery-ocp>=8.0,<9",
  "trimesh>=4.0",
  "numpy",
  "scipy>=1.10",
  "rtree>=1.0",
  "pyfqmr>=0.2",
  "mapbox-earcut>=1.0",
  "shapely>=2.0",
  "networkx>=3.0",
  "psutil>=5.9",
  "opencv-python-headless>=4.7",
  "segno>=1.5",
]

[project.urls]
Homepage = "https://github.com/The-Dorkknight/twoo-step-cad-toolbox"
Legacy = "https://github.com/The-Dorkknight/stl2step"

[project.scripts]
tostep = "tostep.frontends.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tostep.version.PEP440" }

[tool.setuptools.packages.find]
include = ["tostep*"]

[tool.setuptools.package-data]
"*" = ["*.toml", "*.html", "*.js", "*.css", "*.txt", "*.md", "*.xml", "*.manifest", "*.svg", "*.png", "*.json"]
"tostep.plugins.mesh2step" = ["bin/*", "bin/*/*"]
"tostep.frontends.freecad" = ["TOSTEP/*", "TOSTEP/*/*", "TOSTEP/*/*/*"]
"tostep.frontends.fusion" = ["TOSTEP/*", "TOSTEP/*/*", "TOSTEP/*/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::RuntimeWarning"]
